[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arch-forge"
version = "0.1.0"
description = "A CLI scaffolder for Python Hexagonal Architecture projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Insidetec", email = "insidetec@example.com" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[project.scripts]
arch-forge = "arch_forge.main:app"

[tool.hatch.build.targets.wheel]
packages = ["arch_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
